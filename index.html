<!DOCTYPE html>

<title>Mis Finanzas</title>
<style>
:root{--bg:#f0f6fc;--c:#fff;--t:#0f2133;--m:#60768b;--p:#2563eb;--p2:#0ea5e9;--g:#10b981;--ok:#0f9d6b;--bad:#ef4444;--w:#f59e0b;--b:#e0eaf4;--sh:0 10px 30px -16px #0b3a7a55;--r:20px;--grad:linear-gradient(135deg,#2563eb,#0ea5e9 55%,#10b981)}
:root{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a1626;--c:#112038;--t:#e8f1fb;--m:#9db3c9;--b:#263a54;--sh:0 14px 34px -20px #000e;--ok:#34d399;--p:#5aa2ff;--bad:#fb7185;--w:#fbbf24}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a1626;--c:#112038;--t:#e8f1fb;--m:#9db3c9;--b:#263a54;--sh:0 14px 34px -20px #000e;--ok:#34d399;--p:#5aa2ff;--bad:#fb7185;--w:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Inter,"SF Pro Text",system-ui,"Segoe UI",sans-serif;color:var(--t);background:var(--bg)}
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:linear-gradient(180deg,#0b2a4f,#0a3d62 60%,#0b5a55);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.brand .lg{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:22px}.brand b{display:block;font-size:17px}.brand small{opacity:.7;font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-radius:13px;padding:12px 14px;color:#c4d8ea;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;text-align:left;transition:.2s}
nav button span{font-size:19px;width:26px;text-align:center}nav button:hover{background:#ffffff14;color:#fff}
nav button.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px #10b981}
.content{flex:1;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 28px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}
.topbar div{display:flex;align-items:center;gap:10px}.topbar small{color:var(--m);font-weight:600}.topbar input{width:auto}#st{font-size:12px;color:var(--m)}
main{max-width:1040px;margin:auto;padding:22px 28px 60px;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
h2{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}.hint{color:var(--m);font-size:13px;margin:0 0 12px}
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:26px;margin-bottom:16px;box-shadow:0 20px 40px -20px #0ea5e9;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#ffffff1c}.hero::before{width:220px;height:220px;right:-50px;top:-90px}.hero::after{width:150px;height:150px;right:90px;bottom:-80px}
.hero small{opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}.big{font-size:46px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px;line-height:1.1}.big.neg{color:#ffe0e0}
.hrow{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}.hrow span{background:#ffffff26;border:1px solid #ffffff30;border-radius:999px;padding:6px 14px;font-size:13px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.st{background:color-mix(in srgb,var(--p) 5%,var(--c));border:1px solid var(--b);border-left:4px solid var(--p);border-radius:16px;padding:13px 14px}
.st:has(.ok){border-left-color:var(--g)}.st:has(.bad){border-left-color:var(--bad)}.st:has(.w){border-left-color:var(--w)}
.st small{color:var(--m);display:block;font-size:12px;margin-bottom:2px}.st b{font-size:21px;letter-spacing:-.02em}
.ok{color:var(--ok)}.bad{color:var(--bad)}.w{color:var(--w)}
.alert{padding:14px 18px;border-radius:16px;font-weight:600;margin-bottom:16px;border:1px solid}.alert.bad{background:#ef444414;color:var(--bad);border-color:#ef444440}.alert.ok{background:#10b98118;color:var(--ok);border-color:#10b98140}
.bar{height:12px;background:var(--b);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--g));border-radius:99px;transition:width .5s}
.ring{--p:0;--col:var(--g);width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),var(--b) 0);display:grid;place-items:center;position:relative;margin:6px 0}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--c)}.ring b{position:relative;font-size:22px}.rc{display:flex;justify-content:center}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.fl span{display:block;font-size:12px;color:var(--m);margin-bottom:5px;font-weight:600}
input,select{width:100%;font:inherit;color:var(--t);background:var(--bg);border:1.5px solid var(--b);border-radius:12px;padding:11px 12px;transition:.15s}
input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #2563eb22}
.btn{background:var(--grad);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;box-shadow:0 8px 18px -10px #0ea5e9;transition:.15s}.btn:hover{transform:translateY(-1px)}
.btn.s{background:var(--bg);color:var(--t);border:1.5px solid var(--b);box-shadow:none}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-top:14px}
.tile{border:2px solid var(--b);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;user-select:none;transition:.15s;background:var(--bg)}.tile:hover{transform:translateY(-2px);border-color:var(--p)}
.tile small{display:block;color:var(--m);font-size:11px}.tile.d{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;color:#fff}.tile.d small{color:#ffffffe0}
.tile.cur:not(.d){border-color:var(--p);background:#2563eb12}.tile.late:not(.d){border-color:var(--bad);background:#ef444414}
.tile.old{background:color-mix(in srgb,var(--m) 16%,var(--c));border-color:var(--b);color:var(--m);cursor:not-allowed}.tile.old small{color:var(--m)}.tile.fut{border:2px dashed var(--g);background:#10b98110;cursor:not-allowed}.tile.old:hover,.tile.fut:hover{transform:none;border-color:inherit}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s}
.ib.e{background:#2563eb16;color:var(--p)}.ib.e:hover{background:var(--p);color:#fff}.ib.d{background:#ef444416;color:var(--bad)}.ib.d:hover{background:var(--bad);color:#fff}.ib.f{background:#f59e0b1c;color:var(--w)}.ib.f:hover{background:var(--w);color:#fff}
.ov{position:fixed;inset:0;z-index:100;background:#06182dad;backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;animation:fd .2s}
.mdl{background:var(--c);border:1px solid var(--b);border-top:5px solid var(--p);border-radius:24px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px -20px #000b;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fd{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.mx{border:0;background:var(--bg);color:var(--m);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}.mx:hover{background:var(--bad);color:#fff}
.mf{display:flex;flex-direction:column;gap:14px;margin:8px 0 4px}.ma{display:flex;gap:10px;margin-top:20px}.ma .btn{flex:1}
.out .shell,.out #mdl{display:none}#auth{display:none}.out #auth{display:grid}
#auth{min-height:100vh;place-items:center;padding:20px;background:linear-gradient(135deg,#0b2a4f,#1d4ed8 50%,#10b981)}
.ac{width:min(430px,100%);background:var(--c);border-radius:26px;padding:28px;box-shadow:0 30px 80px -20px #000a;animation:pop .35s}
.ab{text-align:center;margin-bottom:18px}.ab .lg{width:56px;height:56px;margin:0 auto 10px;border-radius:17px;background:var(--grad);display:grid;place-items:center;font-size:28px}.ab h1{margin:0;font-size:24px}.ab p{margin:4px 0 0;color:var(--m);font-size:13px}
.at{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}.at button{flex:1;border:0;background:transparent;color:var(--m);font-weight:600;font-size:14px;font-family:inherit;padding:10px;border-radius:11px;cursor:pointer}.at button.on{background:var(--c);color:var(--p);box-shadow:0 2px 8px #0a2a5a22}
#af{display:flex;flex-direction:column;gap:13px}.ah{margin:0;color:var(--m);font-size:13px}.btn.big{width:100%;padding:14px;font-size:15px}.al{text-align:center;color:var(--m);font-size:13px;margin:2px 0 0}.al a{color:var(--p);font-weight:700;cursor:pointer}
.pw{position:relative}.pw input{padding-right:44px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:17px;padding:6px}
.who{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--g) 14%,var(--c))}
.lgw{position:relative;display:inline-block;width:46px;height:46px;flex:none;cursor:pointer;perspective:300px}.lgw.big{width:132px;height:132px}
.logo{width:100%;height:100%;object-fit:contain;animation:flt 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0b2a4f55);transition:transform .6s}.lgw:hover .logo{filter:drop-shadow(0 0 14px #fbbf24aa) drop-shadow(0 8px 10px #0b2a4f55)}
.lgw.big::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(#fbbf2455,#2563eb00 70%);animation:glow 2.6s ease-in-out infinite}
.lgw.spin .logo{transform:rotateY(360deg)}
.sp{position:absolute;color:#fbbf24;font-size:12px;opacity:0;animation:tw 2.6s ease-in-out infinite;pointer-events:none;z-index:2}.big .sp{font-size:20px}
.sp.s1{top:2%;left:4%}.sp.s2{top:10%;right:0;animation-delay:.9s}.sp.s3{bottom:8%;left:-6%;animation-delay:1.7s}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes glow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.25);opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
.brand{gap:10px}.ahd{margin:0;font-size:20px}
.hi{display:flex;align-items:center;gap:10px}.hi small{display:block;color:var(--m);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.hi b{font-size:18px;letter-spacing:-.01em}
.wave{font-size:26px;display:inline-block;transform-origin:70% 70%;animation:wv 2.6s ease-in-out infinite}@keyframes wv{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(14deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.tr{display:flex;align-items:center;gap:10px}.vb{display:inline-block;padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;color:#fff;background:var(--grad)}
@media(max-width:820px){.hi b{font-size:15px}.hi small{display:none}.tr input{width:130px}#st{display:none}}
.srvw{background:#f59e0b1c;color:var(--w);border:1px solid #f59e0b55;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.hrow span.eg{background:#ef444466;border-color:#ef444488}
.carry{border:2px dashed var(--g);background:color-mix(in srgb,var(--g) 7%,var(--c))}
::placeholder{color:var(--m);opacity:.65}
.side{border-right:1px solid #ffffff14}
.thb{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--b);background:var(--c);cursor:pointer;font-size:17px;display:grid;place-items:center;transition:.2s}.thb:hover{transform:rotate(20deg) scale(1.08)}
.ac{position:relative}.ac .thb{position:absolute;top:14px;right:14px}
:root[data-theme=dark] .card,:root:not([data-theme=light]) .card{--hl:#ffffff0a}
.bb{display:grid;grid-template-columns:1fr 1.4fr;gap:14px 22px;align-items:center;background:var(--grad);color:#fff;border-radius:22px;padding:20px 24px;margin-bottom:16px;box-shadow:0 18px 38px -22px #0ea5e9}
.bb.neg{background:linear-gradient(135deg,#be123c,#f43f5e 70%,#fb923c);box-shadow:0 18px 38px -22px #f43f5e}
.bb small{display:block;opacity:.85;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}.bbm b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.bbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bbs div{background:#ffffff24;border:1px solid #ffffff30;border-radius:14px;padding:10px 14px}.bbs div.g2{background:#7f1d1d55}.bbs b{font-size:20px}
.bb p{grid-column:1/-1;margin:0;font-size:12px;opacity:.9}
@media(max-width:640px){.bb{grid-template-columns:1fr}.bbm b{font-size:32px}}
.codebox{font:700 26px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-align:center;padding:16px 8px;border-radius:14px;background:var(--bg);border:2px dashed var(--p);user-select:all;word-break:break-all}
.chkl{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}.chkl input{width:20px;height:20px;accent-color:var(--g)}
.badin{border-color:var(--bad)!important;background:#ef444410!important}.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.x{color:var(--bad);cursor:pointer;font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid var(--b);text-align:left}tr:last-child td{border:0}tr:hover td{background:var(--bg)}
.chk{width:24px;height:24px;accent-color:var(--g)}ul{padding-left:20px}li{margin:6px 0}
@media(max-width:820px){nav button{font-size:9.5px!important;min-width:0}.shell{display:block}.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:6px;border-radius:22px 22px 0 0;z-index:30}.brand{display:none}nav{flex-direction:row;width:100%}nav button{flex:1;flex-direction:column;gap:2px;padding:8px 2px;font-size:10.5px;text-align:center}main{padding:16px 14px 110px}.topbar{padding:12px 14px}.big{font-size:34px}}

 <table>${L.map(y=>`<tr><td><input class="chk" type="checkbox" ${y.paid[M]?'checked':''} onchange="S.fix.find(z=>z.id=='${y.id}').paid['${M}']=this.checked;save()"></td><td><b>${y.n}</b><br><small class="hint">Día ${y.d||'-'}${y.s?' · desde '+lbl(y.s):''}${y.e?' · hasta '+lbl(y.e):''}</small></td><td class="bad"><b>${fmt(y.a)}</b><br><small class="${y.paid[M]?'ok':'w'}">${y.paid[M]?'✔ Pagado':'Pendiente'}</small></td><td><div class="acts">${bE(`EF='${y.id}';draw()`)}${bF(`endFix('${y.id}')`)}${bD(`delFix('${y.id}')`)}</div></td></tr>`).join('')||'<tr><td class="hint">No hay gastos fijos activos este mes</td></tr>'}</table></div>
 ${off.length?`<div class="card np"><h2>Otros gastos fijos (no activos en ${lbl(M)})</h2><p class="hint">Terminaron antes o empiezan después. Edítalos para reactivarlos.</p><table>${off.map(y=>`<tr><td><b>${y.n}</b><br><small class="hint">${y.s?'desde '+lbl(y.s):''} ${y.e?'· hasta '+lbl(y.e):''}</small></td><td>${fmt(amt(y,y.e||M))}</td><td>${act(y)}</td></tr>`).join('')}</table></div>`:''}`}
function addFix(){const m=+$('#m').value;if(!$('#n').value||!m)return alert('Completa nombre y monto');const s=$('#s').value||M;S.fix.push({id:uid(),n:$('#n').value,m,d:+$('#d').value||0,paid:{},s,e:'',hm:{[s]:m}});save()}
function saveFix(){const x=S.fix.find(y=>y.id==EF),n=$('#en').value.trim(),m=+$('#em').value,s=$('#es').value||M;if(!n||!m)return alert('Completa nombre y monto');
 const old=amt(x,s);x.n=n;x.d=+$('#ed').value||0;x.e=$('#ee').value;
 if(m!=old){if(!Object.keys(x.hm).length)x.hm[x.s||'0000-00']=x.m;x.hm[s]=m;x.m=amt(x,'9999-12');if(x.s&&s<x.s)x.s=s}
 EF=null;save()}
function endFix(id){const x=S.fix.find(y=>y.id==id),p=addM(M,-1);if(!confirm(`¿Finalizar "${x.n}" desde ${lbl(M)}? Se conserva en los meses anteriores y deja de contarse desde este mes.`))return;if(x.s&&p<x.s)S.fix=S.fix.filter(y=>y.id!=id);else x.e=p;save()}
function delFix(id){const x=S.fix.find(y=>y.id==id);if(confirm(`¿Eliminar "${x.n}" por completo? También desaparece de los meses anteriores. (Si solo quieres que deje de contarse, usa "Finalizar").`)){S.fix=S.fix.filter(y=>y.id!=id);EF=null;save()}}
var CUR=null;
function nextV(){const vs=S.rep.filter(r=>r.mes==M).map(r=>r.v);return vs.length?Math.max(...vs)+1:0}
function repData(){const c=calc(M),f=x=>[x.f.slice(8)+'/'+x.f.slice(5,7),x.c,x.d,x.m],tot=c.gv||1;
 const cred=S.cred.map(k=>{const D=dues(k,M),pg=k.p.length*k.v;return[k.n,D.length?D.map(x=>'#'+x.i+(x.late?' (atrasada)':'')).join(', ')+' de '+k.t:'No vence este mes',D.length?D.length*k.v:'',D.length?(D.every(x=>x.pd)?'✔ Pagada':'Pendiente'):'-',pg,restK(k)]});
 return{mes:M,ing:c.ing,gv:c.gv,fix:c.fixP,fixT:c.fix,cm:c.cm,cmP:c.cmP,cmPend:c.cmPend,cmA:c.cmA,eg:c.eg,bal:c.bal,meta:c.meta,cump:Math.round(c.cump),score:c.score,disp:c.disp,day:Math.round(c.day),left:c.left,r:Math.round(c.r*100),
 inc:c.mv.filter(x=>x.t=='i').slice(0,400).map(f),gas:c.mv.filter(x=>x.t=='g').sort((a,b)=>a.f.localeCompare(b.f)).slice(0,400).map(f),cat:Object.entries(c.cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v,Math.round(v/tot*100)]),
 tp:S.cred.reduce((a,x)=>a+restK(x),0),sv:c.ent,fixP:c.fixP,fijos:fx(M).map(x=>[x.n,x.d||'-',x.a,x.paid[M]?'✔ Pagado':'Pendiente']),cred,tips:tips(c)}}
function renderRep(d,lab){const over=d.eg>d.ing,ok=d.cump>=100,sec=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`,tb=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table>`,none='<p class="hint">Sin registros este mes.</p>',s2=s=>/Pagad|✔/.test(s)?`<b class="ok">${s}</b>`:/Pend/.test(s)?`<b class="bad">${s}</b>`:s;
 return`<div class="hero"><small>Informe financiero · ${lbl(d.mes)}${lab?' · '+lab:''}</small><div class="big ${d.bal<0?'neg':''}">${fmt(d.bal)}</div><div class="hrow"><span>⬆ Ingresos <b>${fmt(d.ing)}</b></span><span class="eg">⬇ Egresos <b>${fmt(d.eg)}</b></span><span>🎯 Ahorro <b>${d.cump}%</b></span></div></div>
 <div class="alert ${over?'bad':'ok'}">${over?`⚠ Gastaste más de lo que ganaste: déficit de ${fmt(d.eg-d.ing)}.`:`✔ Gastaste menos de lo que ganaste: superávit de ${fmt(d.bal)}.`}</div>
 ${sec('1. Resumen general',`<div class="g">${stat('Ingresos',fmt(d.ing),'ok')}${stat('Gastos del día a día',fmt(d.gv),'bad')}${stat('Gastos fijos pagados',fmt(d.fix),'bad')}${stat('Fijos por pagar (no contados)',fmt(d.fixT-d.fix),d.fixT-d.fix?'w':'ok')}${stat('Cuotas de créditos pagadas',fmt(d.cmP),'bad')}${stat('Cuotas por pagar (no contadas)',fmt(d.cmPend),d.cmPend?'w':'ok')}${stat('Total egresos',fmt(d.eg),'bad')}${stat('Balance',fmt(d.bal),d.bal<0?'bad':'ok')}</div>`)}
 ${sec('2. Plan de ahorro y estabilidad',`<div class="g">${stat('Meta de ahorro',fmt(d.meta))}${stat('Ahorro entregado',d.sv?fmt(d.sv):'No entregado',d.sv>0&&d.sv>=d.meta?'ok':'w')}${stat('Cumplimiento',d.cump+'%',ok?'ok':'w')}${stat('Estado',ok?'✔ CUMPLIDO':'✘ NO CUMPLIDO',ok?'ok':'bad')}${stat('Disponible para gastar',fmt(d.disp),d.disp<0?'bad':'ok')}${stat('Por día ('+d.left+' días)',fmt(d.day))}${stat('Índice de estabilidad',d.score+'/100',d.score>=70?'ok':d.score>=40?'w':'bad')}${stat('Cuotas / ingresos',d.r+'%',d.r>30?'bad':'ok')}</div>`)}
 ${sec('3. Ingresos',d.inc.length?tb(['Fecha','Categoría','Detalle','Monto'],d.inc.map(x=>[x[0],x[1],x[2],'<b class="ok">'+fmt(x[3])+'</b>'])):none)}
 ${sec('4. Gastos por categoría',d.cat.length?tb(['Categoría','Monto','% del gasto'],d.cat.map(x=>[x[0],'<b class="bad">'+fmt(x[1])+'</b>',x[2]+'%'])):none)}
 ${sec('5. Detalle de gastos',d.gas.length?tb(['Fecha','Categoría','Detalle','Monto'],d.gas.map(x=>[x[0],x[1],x[2],'<b class="bad">'+fmt(x[3])+'</b>'])):none)}
 ${sec('6. Gastos fijos',d.fijos.length?`<p class="hint">Pagado ${fmt(d.fix)} de ${fmt(d.fixT)} · Pendiente ${fmt(d.fixT-d.fix)} (no incluido en egresos)</p>`+tb(['Gasto','Día','Monto','Estado'],d.fijos.map(x=>[x[0],x[1],'<b class="bad">'+fmt(x[2])+'</b>',s2(x[3])])):none)}
 ${sec('7. Créditos',d.cred.length?`<p class="hint">Cuotas pagadas este mes: ${fmt(d.cmP)} · pendientes (no contadas): ${fmt(d.cmPend)} · Deuda total pendiente: ${fmt(d.tp)}</p>`+tb(['Crédito','Cuotas del mes','Valor','Estado','Total pagado','Falta por pagar'],d.cred.map(x=>[x[0],x[1],x[2]===''?'-':fmt(x[2]),s2(x[3]),fmt(x[4]),fmt(x[5])])):none)}
 ${sec('8. Recomendaciones',`<ul>${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`)}`}
const vlab=r=>r.v?'V'+r.v:'Original',fdate=r=>new Date(r.at).toLocaleString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function inf(){const L=S.rep.filter(r=>r.mes==M).sort((a,b)=>a.v-b.v),cur=L.find(r=>r.id==CUR)||L[L.length-1];
 return`<div class="card np"><h2>Informe general detallado</h2><p class="hint">Genera el informe de <b>${lbl(M)}</b>. Cada informe se guarda en tu <b>Histórico</b> con su versión: el primero es el <b>Original</b> y los siguientes V1, V2, V3…</p><div class="acts"><button class="btn" onclick="gen()">⚡ Generar informe de ${lbl(M)}</button><button class="btn s" onclick="print()">🖨 Imprimir / PDF</button><button class="btn s" onclick="TAB='his';draw()">📚 Ver histórico</button></div>
 ${L.length?`<div class="acts" style="margin-top:14px">${L.map(r=>`<button class="btn ${cur&&r.id==cur.id?'':'s'}" style="padding:7px 14px" onclick="CUR='${r.id}';draw()">${vlab(r)} · ${fdate(r)}</button>`).join('')}</div>`:''}</div>
 ${cur?`<p class="hint">📄 Versión <b>${vlab(cur)}</b> · generada el ${fdate(cur)}</p>${renderRep(cur.d,vlab(cur))}`:'<div class="card"><p class="hint">Aún no has generado el informe de este mes. Pulsa "Generar informe".</p></div>'}`}
function his(){const R=[...S.rep].sort((a,b)=>b.mes.localeCompare(a.mes)||b.v-a.v),by={};R.forEach(r=>(by[r.mes]=by[r.mes]||[]).push(r));
 return`<div class="card"><h2>📚 Histórico de informes</h2><p class="hint">Aquí se guardan todos los informes que generas, ordenados por mes y con su número de versión. Se guardan en tu base de datos personal.</p></div>`+(R.length?Object.entries(by).map(([m,L])=>`<div class="card"><div class="hd"><h2>${lbl(m)}</h2><span class="hint">${L.length} informe${L.length>1?'s':''}</span></div><table>${L.map(r=>`<tr><td><span class="vb">${vlab(r)}</span></td><td>${fdate(r)}<br><small class="hint">Balance ${fmt(r.d.bal)} · Ahorro ${r.d.cump}% ${r.d.cump>=100?'✔':'✘'}</small></td><td><div class="acts">${bE(`CUR='${r.id}';M='${r.mes}';TAB='inf';draw()`,'Ver')}${bD(`delRep('${r.id}')`,'Borrar')}</div></td></tr>`).join('')}</table></div>`).join(''):'<div class="card"><p class="hint">Aún no hay informes. Ve a "Informe" y pulsa "Generar informe".</p></div>')}
async function pushRep(){if(!SESS)return;st('Guardando informe…');try{const r=await api({a:'saveRep',rep:S.rep});st(r.ok?'✔ Informe guardado en tu histórico':'⚠ '+(r.err||'No se pudo guardar'))}catch(e){st('⚠ Sin conexión')}}
async function gen(){const k=nextV(),id=uid();S.rep.push({id,mes:M,v:k,at:new Date().toISOString(),d:repData()});CUR=id;sessionStorage.setItem(K,JSON.stringify(S));draw();await pushRep()}
function delRep(id){if(confirm('¿Borrar esta versión del histórico?')){S.rep=S.rep.filter(r=>r.id!=id);if(CUR==id)CUR=null;sessionStorage.setItem(K,JSON.stringify(S));draw();pushRep()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#cfm').innerHTML&&!$('#cdb')){$('#cfm').innerHTML='';return}if(e.key==='Escape'&&(EM||EF||EC||ES||EB||EA)){EM=EF=EC=ES=null;EB=EA=false;draw()}if(e.key==='Enter'&&document.body.classList.contains('out')&&$('#ab')&&!$('#ab').disabled)doAuth(AT=='r'?1:AT=='f'?2:0)});
try{const t=localStorage.getItem('fin_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}themeIcons();
document.querySelectorAll('.logo').forEach(i=>i.src=LOGO);{const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}
async function checkServer(){try{const d=await(await fetch(API)).json();if(!(d.ver>=3)){SRVOLD=true;const b=document.createElement('div');b.className='srvw';b.innerHTML='⚠ El Apps Script publicado es una versión anterior y no valida usuarios. Reemplaza el código con el nuevo <b>Code.gs</b> y publica una <b>Nueva versión</b>.';$('.ac').prepend(b)}}catch(e){}}
authTab('l');
if(SESS){$('#authf').innerHTML='<p class="ah">🔐 Verificando tu sesión…</p>';pull().then(ok=>{if(ok&&SESS){document.body.classList.remove('out');$('#who').textContent=SESS.nombre;idle();draw()}else if(SESS)logoutLocal('No se pudo verificar tu sesión. Inicia sesión de nuevo.')})}
checkServer();
</script></body></html>
